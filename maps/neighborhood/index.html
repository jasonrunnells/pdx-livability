<!DOCTYPE html>
<html lang="en" class="map-fullscreen">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neighborhood Explorer — Portland Livability</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="../../styles.css">
</head>
<body>

<a class="map-back-btn" href="../../index.html">&larr; Home</a>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="../../script.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {

        const GROCERY_COLORS = {
            'Whole Foods Market': '#2e7d32',
            'Natural Grocers': '#f4a261',
            'New Seasons Market': '#4361ee'
        };

        // Source data has a couple of typos ("Gorcers", "Season"
        // singular) — normalize so those still group with the
        // right brand instead of becoming their own category.
        const groceryColorKey = (p) => {
            const raw = (p.Name || '').toLowerCase();
            if (raw.startsWith('whole foods')) return 'Whole Foods Market';
            if (raw.startsWith('natural')) return 'Natural Grocers';
            if (raw.startsWith('new season')) return 'New Seasons Market';
            return p.Name;
        };

        const map = initExplorerMap({
            container: 'map',
            fitBoundsLayer: 'metro',
            showUserLocation: true,
            layers: [
                {
                    id: 'metro',
                    url: '../../data/metro.geojson',
                    type: 'boundary',
                    color: '#111111'
                    // context only — no popup, not clickable
                },
                {
                    id: 'places',
                    url: '../../data/places.geojson',
                    type: 'polygon',
                    colorBy: 'NAME',
                    fillOpacity: 0.12,
                    labelBy: 'NAME',
                    popup: (p) => {
                        const zoning = Object.keys(p)
                            .filter(k => k.startsWith('ZONE_') && typeof p[k] === 'number' && p[k] > 0)
                            .map(k => ({ label: k.replace('ZONE_', '').replace(/_/g, ' '), value: p[k] }))
                            .sort((a, b) => b.value - a.value)
                            .slice(0, 3)
                            .map(z => `${z.label} ${z.value.toFixed(0)}%`)
                            .join(', ');

                        return buildPopup(p.NAME, [
                            { label: 'School District', value: p.SchoolDist_AVG },
                            { label: 'Grocery Stores (5mi)', value: p.Grocery_5mi },
                            { label: 'Grocery Stores (10mi)', value: p.Grocery_10mi },
                            { label: 'Top Zoning', value: zoning }
                        ]);
                    }
                },
                {
                    id: 'grocery',
                    url: '../../data/grocery.geojson',
                    type: 'point',
                    colorKey: groceryColorKey,
                    colorMap: GROCERY_COLORS,
                    directions: true,
                    popup: (p) => buildPopup(p.Name, [
                        { label: 'Category', value: p.Category },
                        { label: 'Address', value: `${p.Address}, ${p.City}, ${p.State} ${p.ZIP}` },
                        { label: 'Notes', value: p.Notes }
                    ])
                },
                {
                    id: 'restaurants',
                    url: '../../data/restaurants.geojson',
                    type: 'point',
                    shape: 'square',
                    color: '#c1443c',
                    cluster: true,
                    pane: 'restaurantPane',
                    paneZIndex: 550,
                    directions: true,
                    popup: (p) => buildPopup(p.USER_NAME, [
                        { label: 'Category', value: p.USER_CATEGORY },
                        { label: 'Address', value: `${p.USER_ADDRESS}, ${p.USER_CITY}, ${p.USER_STATE} ${p.USER_ZIP}` }
                    ])
                }
            ]
        });

        addCategoryLegend(map, [
            {
                title: 'Restaurants',
                items: [
                    { shape: 'square', color: '#c1443c', label: 'Restaurant' }
                ]
            },
            {
                title: 'Grocery Stores',
                items: [
                    { shape: 'circle', color: GROCERY_COLORS['Whole Foods Market'], label: 'Whole Foods Market' },
                    { shape: 'circle', color: GROCERY_COLORS['Natural Grocers'], label: 'Natural Grocers' },
                    { shape: 'circle', color: GROCERY_COLORS['New Seasons Market'], label: 'New Seasons Market' }
                ]
            }
        ]);
    });
</script>
</body>
</html>
