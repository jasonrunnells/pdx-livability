<!DOCTYPE html>
<html lang="en" class="map-fullscreen">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>September 2026 Observations — Portland Livability</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="../../../styles.css">
<style>
html,body,#map{height:100%;width:100%;margin:0}#map{position:absolute;inset:0}
.observations-legend{width:auto!important;min-width:180px;background:#fff;padding:12px 16px;border:1px solid #ddd;font:13px "Host Grotesk",sans-serif;color:#333;box-shadow:0 2px 8px #00000014}
.observations-toggle{display:flex;align-items:center;gap:9px;cursor:pointer;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid #ddd}
.observations-switch{appearance:none;-webkit-appearance:none;width:38px;height:20px;flex-shrink:0;margin:0;position:relative;border:0;border-radius:999px;background:#d8d8d8;cursor:pointer}
.observations-switch::before{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004;transition:transform .2s}
.observations-switch:checked{background:#2a9d8f}.observations-switch:checked::before{transform:translateX(18px)}.observations-switch:focus-visible{outline:2px solid #333;outline-offset:2px}
.observations-legend .map-legend-title{font-weight:600;margin-bottom:8px}.observations-legend .map-legend-row{display:flex;align-items:center;gap:8px;margin:5px 0}.observations-legend .map-legend-swatch{display:inline-block;width:12px;height:12px;border-radius:50%;flex-shrink:0}
.observation-notes{white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0}.observation-photos{display:grid;gap:10px}.observation-photos img{display:block;width:100%;max-height:260px;object-fit:contain;background:#f5f5f5;border-radius:3px}.observation-photos a{display:block}.observation-popup .leaflet-popup-content{width:280px!important;max-width:calc(100vw - 80px);margin:14px}.observation-popup .leaflet-popup-content-wrapper{max-height:75vh;overflow:auto}
.observations-error{background:white;padding:10px;max-width:260px;font:13px sans-serif}
</style>
</head>
<body>
<a class="map-back-btn" href="../../../index.html">&larr; Home</a>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../../../script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const map = initExplorerMap({container:'map',showUserLocation:true,layers:[]});
    map.createPane('observations');
    map.getPane('observations').style.zIndex = 450;
    const colors = {Yes:'#2e7d32',Maybe:'#e9a23b',No:'#c1443c',Remember:'#4361ee'};
    const palette = ['#e63946','#f4a261','#e9c46a','#2a9d8f','#457b9d','#8e7dbe','#e76f9a','#70a288'];
    const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function loadJSON(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Could not load ${url} (${response.status})`);
        return response.json();
    }
    let neighborhoods = null;
    let neighborhoodVisible = false;
    const legend = L.control({position:'bottomleft'});
    legend.onAdd = () => {
        const box = L.DomUtil.create('div','map-legend observations-legend');
        box.innerHTML = '<label class="observations-toggle"><input class="observations-switch" type="checkbox" aria-label="Neighborhood polygons"><span>Neighborhoods</span></label><div class="map-legend-title">September 2026 Observations</div>' + Object.entries(colors).map(([label,color]) => `<div class="map-legend-row"><span class="map-legend-swatch" style="background:${color}"></span>${label}</div>`).join('');
        box.querySelector('input').addEventListener('change', event => {
            neighborhoodVisible = event.target.checked;
            if (neighborhoods) neighborhoods.setStyle({opacity:neighborhoodVisible?1:0,fillOpacity:neighborhoodVisible?.35:0});
        });
        L.DomEvent.disableClickPropagation(box);
        L.DomEvent.disableScrollPropagation(box);
        return box;
    };
    legend.addTo(map);
    function showError(error) {
        console.error(error);
        const control = L.control({position:'topright'});
        control.onAdd = () => {const box=L.DomUtil.create('div','observations-error');box.textContent=error.message;L.DomEvent.disableClickPropagation(box);return box;};
        control.addTo(map);
    }
    await Promise.allSettled([
        loadJSON('../../../data/metro.geojson').then(data => buildLayer(data,{type:'boundary',color:'#111111'}).addTo(map)).catch(showError),
        loadJSON('../../../data/places.geojson').then(data => {
            neighborhoods = L.geoJSON(data, {
                interactive:false,
                style:feature => {
                    const name=String(feature.properties.NAME || '');
                    let index=0;
                    for(let i=0;i<name.length;i++) index=(index+name.charCodeAt(i))%palette.length;
                    return {color:'#000',weight:1,opacity:neighborhoodVisible?1:0,fillColor:palette[index],fillOpacity:neighborhoodVisible?.35:0};
                }
            }).addTo(map);
            const update=setupAutoLabels(map,neighborhoods,{labelBy:'NAME'});
            map.on('moveend',update);
            update();
        }).catch(showError),
        loadJSON('./sept_observations.geojson').then(data => {
            const points=L.geoJSON(data, {
                pane:'observations',
                pointToLayer:(feature,latlng) => L.circleMarker(latlng,{pane:'observations',radius:7,weight:1.5,color:'#fff',fillColor:colors[feature.properties.Observation_Type]||'#555',fillOpacity:.95,className:'label-obstacle'}),
                onEachFeature:(feature,layer) => {
                    const p=feature.properties;
                    const [lng,lat]=feature.geometry.coordinates;
                    const images=(p.Photos || []).map(path => {
                        const url=path.split('/').map(encodeURIComponent).join('/');
                        return `<a href="${url}" target="_blank" rel="noopener noreferrer"><img src="${url}" alt="Observation photo" loading="lazy"></a>`;
                    }).join('');
                    layer.bindPopup(`<div class="popup-card"><div class="popup-title">${escapeHTML(p.Observation_Type)} — Observation ${escapeHTML(p.OBJECTID)}</div>${p.Notes?`<div class="observation-notes">${escapeHTML(p.Notes)}</div>`:''}${images?`<div class="observation-photos">${images}</div>`:''}${buildDirectionsLink(lat,lng)}</div>`,{className:'observation-popup',maxWidth:320});
                    layer.bindTooltip(escapeHTML(p.Observation_Type),{direction:'top'});
                }
            }).addTo(map);
            const portland=data.features.filter(f => {const [lng,lat]=f.geometry.coordinates;return lng>-124&&lng<-121&&lat>44&&lat<47;});
            const bounds=portland.length?L.latLngBounds(portland.map(f=>[f.geometry.coordinates[1],f.geometry.coordinates[0]])):points.getBounds();
            if(bounds.isValid()) map.fitBounds(bounds,{padding:[35,35],maxZoom:14});
        }).catch(showError)
    ]);
});
</script>
</body>
</html>
