  workflow_dispatch:          # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the project
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
